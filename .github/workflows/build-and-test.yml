name: CI
on:
  push:
    branches: [ master, Test ]
  pull_request:
    branches: [ master, Test ]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: install aws dotnet tools
        run: dotnet tool install -g Amazon.Lambda.Tools --version 5.3.0
      - name: build
        run: dotnet build
      - name: test
        run: dotnet test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v2
        with:
          node-version: 20
      - name: install test infrastructure
        run: sudo npm install -g @angular/cli
      - name: install deps
        run: |
          cd portal
          npm ci
      - name: build
        run:  |
          cd portal
          ng build --prod
      - name: test
        run:  |
          cd portal
          make unit-test
